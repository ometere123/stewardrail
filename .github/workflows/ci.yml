name: CI
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit + exact-source adversarial harness
        run: python -m pytest -q
      - name: GenVM lint exact deployable sources
        run: bash scripts/genvm_lint.sh
      - name: Mutation battery
        run: python tests/mutation_check.py
      - name: Exact source manifest
        run: python scripts/update_source_manifest.py --check
      - name: Repository preflight
        run: python scripts/preflight.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GENLAYER_NETWORK: ${{ vars.NEXT_PUBLIC_GENLAYER_NETWORK }}
      NEXT_PUBLIC_GENLAYER_CHAIN_ID: ${{ vars.NEXT_PUBLIC_GENLAYER_CHAIN_ID }}
      NEXT_PUBLIC_GENLAYER_RPC: ${{ vars.NEXT_PUBLIC_GENLAYER_RPC }}
      NEXT_PUBLIC_GENLAYER_EXPLORER: ${{ vars.NEXT_PUBLIC_GENLAYER_EXPLORER }}
      NEXT_PUBLIC_STEWARD_CHARTER: ${{ vars.NEXT_PUBLIC_STEWARD_CHARTER }}
      NEXT_PUBLIC_EVIDENCE_REGISTRY: ${{ vars.NEXT_PUBLIC_EVIDENCE_REGISTRY }}
      NEXT_PUBLIC_STEWARD_COURT: ${{ vars.NEXT_PUBLIC_STEWARD_COURT }}
      NEXT_PUBLIC_STEWARD_GUARD: ${{ vars.NEXT_PUBLIC_STEWARD_GUARD }}
      NEXT_PUBLIC_STEWARD_VAULT: ${{ vars.NEXT_PUBLIC_STEWARD_VAULT }}
      NEXT_PUBLIC_STEWARD_BOND_VAULT: ${{ vars.NEXT_PUBLIC_STEWARD_BOND_VAULT }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  cli-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Repository-local CLI is exactly 0.39.1
        run: npx --no-install genlayer --version | grep '0.39.1'
